name: Fix confirmed Savelys removal on TopCashback
on:
  push:
    paths:
      - '.github/workflows/fix-savelys-tc-20261029.yml'
      - 'scripts/fix_savelys_tc_20261029.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Savelys TC only
        run: python3 scripts/fix_savelys_tc_20261029.py
      - name: Publish
        run: |
          git config user.name cashback-update-bot
          git config user.email cashback-update-bot@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Apply previously confirmed Savelys TC removal" && git push)
