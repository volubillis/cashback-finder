name: Preserve Dowinx IDs
on:
  push:
    paths:
      - '.github/workflows/fix-dowinx.yml'
      - 'scripts/fix_dowinx_ids.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_dowinx_ids.py
      - run: |
          git config user.name cashback-update-bot
          git config user.email cashback-update-bot@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Preserve Dowinx merchant IDs" && git push)
