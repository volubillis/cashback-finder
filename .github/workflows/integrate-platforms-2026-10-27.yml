name: Integrate approved cashback CSVs 2026-10-27
on:
  push:
    paths:
      - 'scripts/apply_platform_csv_20261027.py'
      - 'updates/rp-2026-10-27.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and integrate CSV files
        run: python3 scripts/apply_platform_csv_20261027.py
      - name: Save updated catalog and audit report
        run: |
          git config user.name "cashback-update-bot"
          git config user.email "cashback-update-bot@users.noreply.github.com"
          git add index.html updates/report-2026-10-27.json
          git diff --cached --quiet || (git commit -m "Integrate approved RP RR Widilo 27 Oct CSVs" && git push)
