name: Apply RP Widilo 2026-10-29
on:
  push:
    paths:
      - '.github/workflows/rp-wi-2026-10-29.yml'
      - 'scripts/apply_rp_wi_20261029.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_rp_wi_20261029.py
      - run: |
          git config user.name cashback-update-bot
          git config user.email cashback-update-bot@users.noreply.github.com
          git add index.html updates/report-rp-wi-2026-10-29.json
          git diff --cached --quiet || (git commit -m "Apply approved RP and Widilo October 29" && git push)
