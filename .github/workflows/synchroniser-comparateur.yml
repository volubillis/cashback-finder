name: Synchroniser le comparateur HTML
on:
  push:
    paths:
      - 'data/maj-2026-11-02.json'
      - 'data/verifications-2026-11-02.json'
      - 'data/declencher-synchronisation.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer les releves
        run: python3 scripts/synchroniser_releves.py
      - name: Publier index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Synchroniser les taux et dates du 2 novembre"
            git push
          fi
