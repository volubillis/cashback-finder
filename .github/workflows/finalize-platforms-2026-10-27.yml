name: Finalize approved October 27 platform data
on:
  push:
    paths:
      - 'scripts/fix_platform_csv_20261027.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate merchant aliases and histories
        run: python3 scripts/fix_platform_csv_20261027.py
      - name: Commit and publish
        run: |
          git config user.name "cashback-update-bot"
          git config user.email "cashback-update-bot@users.noreply.github.com"
          git add index.html updates/report-final-2026-10-27.json
          git diff --cached --quiet || (git commit -m "Finalize RP RR Widilo October 27 update" && git push)
