name: Apply validated RR October 29
on:
  push:
    paths:
      - '.github/workflows/rr-oct29.yml'
      - 'scripts/rr_oct29_note.py'
      - 'updates/rr-2026-10-29.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed RR changes
        run: python3 scripts/rr_oct29_note.py
      - name: Publish updated index
        run: |
          git config user.name "cashback-update-bot"
          git config user.email "cashback-update-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Apply validated RR October 29" && git push)
