
name: Surveillance TopCashback

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier les offres
        run: python check_topcashback.py
      - name: Publier les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topcashback-alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation TopCashback"
            git push
          fi
