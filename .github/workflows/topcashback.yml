
name: Surveillance et taux TopCashback

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/topcashback.yml'

  schedule:
    # Surveillance des promotions toutes les 15 minutes environ
    - cron: '7,22,37,52 * * * *'

    # Horaire reserve aux taux : 9 h en France
    - cron: '0 7,8 * * *'

  workflow_dispatch:
    inputs:
      update_rates:
        description: 'Actualiser tous les taux TopCashback maintenant ?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detecter les promotions speciales
        run: python check_topcashback.py

      - name: Determiner si les taux doivent etre actualises
        id: daily
        shell: bash
        run: |
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Mise a jour des taux suspendue temporairement."

      # Desactive jusqu'a validation du nouveau systeme
      - name: Actualiser les taux marchands
        if: ${{ false }}
        run: python update_topcashback_rates.py

      - name: Enregistrer les nouveaux taux
        if: ${{ false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topcashback-rates.json

          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour des taux TopCashback"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Valider les donnees
        run: |
          python -m json.tool topcashback-alerts.json > /dev/null
          python -m json.tool topcashback-rates.json > /dev/null
          test -f index.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
