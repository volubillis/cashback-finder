
name: Surveillance et taux TopCashback

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    # 09:00 in France is 07:00 UTC (summer) or 08:00 UTC (winter).
    - cron: '0 7,8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detecter les promotions speciales
        run: python check_topcashback.py

      - name: Verifier si 9 h en France
        id: daily
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 7,8 * * *" ] && [ "$(TZ=Europe/Paris date +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Actualiser les taux marchands (une fois par jour)
        if: steps.daily.outputs.run == 'true'
        run: python update_topcashback_rates.py

      - name: Enregistrer les taux quotidiens pour les prochains deploiements
        if: steps.daily.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topcashback-rates.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour quotidienne taux TopCashback"
            git push
          fi

      - name: Valider les donnees
        run: |
          python -m json.tool topcashback-alerts.json > /dev/null
          python -m json.tool topcashback-rates.json > /dev/null
          test -f index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
